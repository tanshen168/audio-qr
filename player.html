<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>语音播放</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .player-card {
      background: #fff;
      border-radius: 24px;
      padding: 40px 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .player-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
    }

    .player-icon svg {
      width: 40px;
      height: 40px;
      fill: #fff;
    }

    .player-title {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .player-subtitle {
      font-size: 13px;
      color: #999;
      margin-bottom: 28px;
    }

    .audio-wrapper {
      margin-bottom: 20px;
    }

    .audio-wrapper audio {
      width: 100%;
      outline: none;
    }

    .play-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      font-size: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .play-btn:active {
      transform: scale(0.95);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .play-btn svg {
      width: 32px;
      height: 32px;
      fill: #fff;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #eee;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      width: 0%;
      transition: width 0.3s;
      border-radius: 3px;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 24px;
    }

    .nav-btns {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .nav-btn {
      padding: 10px 24px;
      border: 2px solid #667eea;
      border-radius: 20px;
      background: transparent;
      color: #667eea;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }

    .nav-btn:active {
      background: #667eea;
      color: #fff;
    }

    .loading {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #eee;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-msg {
      color: #e74c3c;
      font-size: 14px;
      padding: 16px;
      background: #fdf0ef;
      border-radius: 12px;
      margin-top: 12px;
      display: none;
    }

    @media (max-width: 380px) {
      .player-card {
        padding: 30px 20px;
      }
      .player-title {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="player-card">
    <div class="player-icon">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    </div>
    <div class="player-title" id="title">加载中...</div>
    <div class="player-subtitle" id="subtitle">扫码听语音</div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="time-display">
      <span id="currentTime">00:00</span>
      <span id="duration">00:00</span>
    </div>

    <button class="play-btn" id="playBtn" onclick="togglePlay()">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>

    <div class="audio-wrapper" style="display:none">
      <audio id="audioPlayer" preload="auto"></audio>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="nav-btns" id="navBtns" style="display:none">
      <a class="nav-btn" id="prevBtn" href="javascript:void(0)" onclick="nav(-1)">上一课</a>
      <a class="nav-btn" id="nextBtn" href="javascript:void(0)" onclick="nav(1)">下一课</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const audio = document.getElementById('audioPlayer');
    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const errorMsg = document.getElementById('errorMsg');
    const navBtns = document.getElementById('navBtns');

    const params = new URLSearchParams(window.location.search);
    const audioId = parseInt(params.get('id')) || 1;
    const item = audioList.find(a => a.id === audioId) || audioList[0];

    titleEl.textContent = item.title;
    subtitleEl.textContent = '第 ' + item.id + ' 期 / 共 ' + audioList.length + ' 期';
    audio.src = item.url;

    // 上一课/下一课按钮
    const idx = audioList.findIndex(a => a.id === audioId);
    if (idx > 0) {
      document.getElementById('prevBtn').href = 'player.html?id=' + audioList[idx - 1].id;
    } else {
      document.getElementById('prevBtn').style.display = 'none';
    }
    if (idx < audioList.length - 1) {
      document.getElementById('nextBtn').href = 'player.html?id=' + audioList[idx + 1].id;
    } else {
      document.getElementById('nextBtn').style.display = 'none';
    }
    navBtns.style.display = 'flex';

    function togglePlay() {
      if (audio.paused) {
        audio.play().catch(e => {
          errorMsg.style.display = 'block';
          errorMsg.textContent = '音频加载失败，请检查音频链接是否有效。';
        });
      } else {
        audio.pause();
      }
    }

    audio.addEventListener('play', () => {
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
    });

    audio.addEventListener('pause', () => {
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = pct + '%';
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
      progressFill.style.width = '0%';
    });

    audio.addEventListener('error', () => {
      errorMsg.style.display = 'block';
      errorMsg.textContent = '音频加载失败，请检查音频链接是否可正常访问。';
    });

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function nav(dir) {
      // handled by href, this is fallback
    }

    // Attempt autoplay (may be blocked on some mobile browsers)
    window.addEventListener('load', () => {
      setTimeout(() => {
        audio.play().catch(() => {
          // Autoplay blocked - user needs to tap play
        });
      }, 500);
    });
  </script>
</body>
</html>
